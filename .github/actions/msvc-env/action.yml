# The environment of the Visual Studio x64 developer prompt (vcvars64.bat) for the steps after this one: the variables it sets
# or changes (PATH, INCLUDE, LIB...) go to GITHUB_ENV. It does what ilammy/msvc-dev-cmd did, without a JavaScript runtime.
name: MSVC environment
description: Sets up the Visual Studio x64 compiler environment for the following steps
runs:
  using: composite
  steps:
    - shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vs) { throw "no Visual Studio with the C++ tools on this runner" }
        $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
        $lines = cmd /c "`"$vcvars`" >nul && set"
        if ($LASTEXITCODE -ne 0) { throw "$vcvars failed" }
        foreach ($line in $lines) {
          if ($line -notmatch '^([^=]+)=(.*)$') { continue }
          $name, $value = $Matches[1], $Matches[2]
          if ([Environment]::GetEnvironmentVariable($name) -ne $value) {
            "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
        }
