name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.9.0"

jobs:
  # Everything (runtime, editor, flowstudio, examples), MSVC 2022, both test suites.
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/msvc-env
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake --preset windows-release
        env:
          QT_DIR: ${{ env.QT_ROOT_DIR }}
      - name: Build
        run: cmake --build --preset windows-release
      - name: Test
        run: ctest --preset windows-release

  # Everything with GCC on Linux (the editor tests run on the offscreen platform).
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libvulkan-dev libfontconfig1-dev
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true
      - name: Configure
        run: cmake --preset linux-release
        env:
          QT_DIR: ${{ env.QT_ROOT_DIR }}
      - name: Build
        run: cmake --build --preset linux-release
      - name: Test
        run: ctest --preset linux-release
      # Every text of the editor is in the translation files (lupdate finds nothing new) and every one has a translation.
      - name: The translations are up to date
        run: |
          cmake --build --preset linux-release --target flowgraph_lupdate
          git diff --exit-code -- Editor/Translations
          if grep -n '<translation type="unfinished"></translation>' Editor/Translations/*.ts; then
            echo "::error::texts without a translation (above): translate them in Editor/Translations"
            exit 1
          fi
          # the same for the texts of the nodes (Core/Translations/<code>.json, written by flow --translations)
          for catalog in Core/Translations/*.json; do ./build/linux-release/bin/flow --no-plugins --translations "$catalog"; done
          # and of the FileSystem plugin (its own catalogs: only its texts)
          for catalog in Plugins/FileSystem/Translations/*.json; do
            ./build/linux-release/bin/flow --no-plugins --plugins build/linux-release/bin/plugins --only FileSystem --translations "$catalog"
          done
          # and of the embedded example (its windows and its nodes)
          cmake --build --preset linux-release --target embedded_example_lupdate
          for catalog in Examples/Embedded/Translations/messages_*.json; do
            QT_QPA_PLATFORM=offscreen ./build/linux-release/bin/embedded_example --translations "$catalog"
          done
          git diff --exit-code -- Core/Translations Plugins/FileSystem/Translations Examples/Embedded/Translations
          if grep -n '<translation type="unfinished"></translation>' Examples/Embedded/Translations/*.ts; then
            echo "::error::texts without a translation (above): translate them in Examples/Embedded/Translations"
            exit 1
          fi
          if grep -n '", ""\]' Core/Translations/*.json Plugins/FileSystem/Translations/*.json Examples/Embedded/Translations/*.json; then
            echo "::error::node texts without a translation (above): translate them in their Translations folder"
            exit 1
          fi

  # The runtime alone must build without Qt; tests run under AddressSanitizer and UndefinedBehaviorSanitizer.
  core-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake --preset core-only -DCMAKE_BUILD_TYPE=RelWithDebInfo
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined"
          "-DCMAKE_MODULE_LINKER_FLAGS=-fsanitize=address,undefined"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build --preset core-only
      - name: Test
        run: ctest --preset core-only

  # The installed package works for a host project: install, then build and run Tests/Consumer against it with find_package.
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and install the runtime
        run: |
          cmake --preset core-only
          cmake --build --preset core-only
          cmake --install build/core-only --prefix "$PWD/prefix" --component FlowGraph
      - name: Build and run a consumer of the package
        run: |
          cmake -S Tests/Consumer -B build/consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build build/consumer
          ./build/consumer/consumer
      - name: The node reference is up to date
        run: |
          ./build/core-only/bin/flow --no-plugins --reference build/NodeReference.md
          diff -u Docs/NodeReference.md build/NodeReference.md
