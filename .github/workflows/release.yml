name: Release

# A release is made by pushing a tag:   git tag v0.3.0 && git push origin v0.3.0
# The tag must match project(FlowGraph VERSION ...) in CMakeLists.txt. Windows and Linux are built and tested, packed with what they
# need to run (Qt included) and attached to a DRAFT release: check its notes on GitHub, then press Publish.
# Run it by hand (Actions > Release > Run workflow) to build the packages without making a release: they are kept as artifacts of
# the run, to try before tagging.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: "6.9.0"

jobs:
  # The version: from CMakeLists.txt, and it must be the one of the tag.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          version=$(grep -oP 'project\(FlowGraph VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          if [ -z "$version" ]; then echo "::error::no version in CMakeLists.txt"; exit 1; fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::the tag ${GITHUB_REF_NAME} does not match the version $version in CMakeLists.txt (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # flow, flowstudio and the SDK (headers, libraries, CMake package), with Qt and the MSVC runtime next to them.
  windows:
    needs: version
    runs-on: windows-2022
    env:
      PACKAGE: FlowGraph-${{ needs.version.outputs.version }}-windows-x64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/msvc-env
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake --preset windows-release
        env:
          QT_DIR: ${{ env.QT_ROOT_DIR }}
      - name: Build
        run: cmake --build --preset windows-release
      - name: Test
        run: ctest --preset windows-release
      - name: Install and deploy Qt
        shell: bash
        run: |
          cmake --install build/windows-release --prefix "dist/$PACKAGE" --component FlowGraph
          # Qt's own translations (its dialogs and buttons) for the languages the editor has (Editor/Translations/flowgraph_<code>.ts)
          languages=$(ls Editor/Translations/flowgraph_*.ts | sed 's|.*/flowgraph_||; s|\.ts$||' | paste -sd, -)
          windeployqt --release --translations "$languages" --no-system-d3d-compiler --no-opengl-sw --compiler-runtime \
            "dist/$PACKAGE/bin/flowstudio.exe" "dist/$PACKAGE/bin/FlowGraphEditor.dll"
          # the offscreen platform: flowstudio without a display (and the check below)
          cp "$(cygpath -u "$QT_ROOT_DIR")/plugins/platforms/qoffscreen.dll" "dist/$PACKAGE/bin/platforms/"
          cp -r LICENSE LICENSES README.md "dist/$PACKAGE/"          # also in share/doc/FlowGraph (cmake --install), with KDDockWidgets'
          mkdir -p "dist/$PACKAGE/examples" && cp Examples/Scripts/*.flow "dist/$PACKAGE/examples/"   # to try it (README: Try it)
      - name: Check that the package runs on its own
        shell: pwsh
        run: |
          $bin = "dist\$env:PACKAGE\bin"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"      # no Qt, no compiler: only what the package brings
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          & "$bin\flow.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "flow does not start" }
          & "$bin\flow.exe" --no-plugins --reference smoke-reference.md
          if ($LASTEXITCODE -ne 0) { throw "flow --reference failed" }
          $out = & "$bin\flow.exe" "dist\$env:PACKAGE\examples\fizzbuzz.flow"
          if ($LASTEXITCODE -ne 0 -or $out -notcontains "FizzBuzz") { throw "the FizzBuzz example does not run: $out" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:FG_STUDIO_SCREENSHOT = "$PWD\smoke.png"
          $p = Start-Process "$bin\flowstudio.exe" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "flowstudio did not end" }
          if ($p.ExitCode -ne 0) { throw "flowstudio ended with $($p.ExitCode)" }
          if (-not (Test-Path smoke.png)) { throw "flowstudio did not start" }
      - name: Pack
        shell: bash
        run: cd dist && 7z a -tzip "../$PACKAGE.zip" "$PACKAGE" > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: ${{ env.PACKAGE }}.zip
          if-no-files-found: error

  # The same for Linux: the programs find their libraries next to them (RPATH $ORIGIN/../lib), Qt and its plugins are bundled.
  # Built on AlmaLinux 8 (glibc 2.28) with GCC 13 (gcc-toolset: the parts of its C++ library that GCC 8's lacks are linked into
  # the binaries): a program needs the C library of the system it was built on or a newer one, so the package runs on the
  # distributions of 2019 on - RHEL / CentOS / Alma / Rocky 8 and 9, Debian 10, Ubuntu 20.04 and newer.
  linux:
    needs: version
    runs-on: ubuntu-24.04
    container: almalinux:8
    env:
      PACKAGE: FlowGraph-${{ needs.version.outputs.version }}-linux-x64
      CC: /opt/rh/gcc-toolset-13/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-13/root/usr/bin/g++
    steps:
      - name: Install build tools
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled powertools
          # the compiler, the build tools, git for the checkout, Python for aqtinstall, and what Qt needs to build and to run the
          # tests (offscreen: fontconfig, freetype, a font)
          dnf install -y gcc-toolset-13-gcc-c++ git cmake ninja-build python3.11 python3.11-pip which file findutils tar gzip \
            binutils mesa-libGL-devel mesa-libEGL-devel libxkbcommon-devel fontconfig-devel freetype-devel vulkan-headers \
            dejavu-sans-fonts dejavu-sans-mono-fonts
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Qt
        run: |
          # with aqtinstall (the install-qt-action would set up a Python built for Ubuntu, which needs a newer glibc than this)
          python3.11 -m pip install --quiet aqtinstall
          python3.11 -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 --outputdir /opt/Qt
          test -x "/opt/Qt/$QT_VERSION/gcc_64/bin/qmake"
          echo "QT_ROOT_DIR=/opt/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"
      - name: Configure
        # lib, not lib64 (the default of RHEL-like systems): the layout of the package, and where its RPATH looks
        run: cmake --preset linux-release -DCMAKE_INSTALL_LIBDIR=lib '-DCMAKE_INSTALL_RPATH=$ORIGIN/../lib'
        env:
          QT_DIR: ${{ env.QT_ROOT_DIR }}
      - name: Build
        run: cmake --build --preset linux-release
      - name: Test
        run: ctest --preset linux-release
      - name: Install and bundle Qt
        run: |
          dist="dist/$PACKAGE"
          cmake --install build/linux-release --prefix "$dist" --component FlowGraph
          # Qt's plugins: X11 (xcb) and offscreen platforms, SVG images and icons
          for p in platforms/libqxcb.so platforms/libqoffscreen.so imageformats/libqsvg.so iconengines/libqsvgicon.so; do
            mkdir -p "$dist/plugins/$(dirname "$p")"
            cp "$QT_ROOT_DIR/plugins/$p" "$dist/plugins/$p"
          done
          cp -r "$QT_ROOT_DIR/plugins/xcbglintegrations" "$dist/plugins/"
          printf '[Paths]\nPrefix=..\nPlugins=plugins\n' > "$dist/bin/qt.conf"
          # every Qt library (and ICU) that the programs, libraries and plugins need, until nothing is missing
          for pass in 1 2 3 4; do
            find "$dist/bin" "$dist/lib" "$dist/plugins" -type f \( -name '*.so*' -o -perm -u+x \) | while read -r f; do
              LD_LIBRARY_PATH="$QT_ROOT_DIR/lib" ldd "$f" 2>/dev/null | awk '/=>/ { print $3 }' | grep "^$QT_ROOT_DIR/lib/" || true
            done | sort -u | while read -r dep; do
              [ -e "$dist/lib/$(basename "$dep")" ] || cp -L "$dep" "$dist/lib/"
            done
          done
          # Qt's own translations for the editor's languages, where the editor looks for them (bin/../translations)
          mkdir -p "$dist/translations"
          for ts in Editor/Translations/flowgraph_*.ts; do
            code=$(basename "$ts" .ts); code=${code#flowgraph_}
            cp "$QT_ROOT_DIR/translations/qtbase_$code.qm" "$dist/translations/" 2>/dev/null || echo "no Qt translation for $code"
          done
          cp -r LICENSE LICENSES README.md "$dist/"
          mkdir -p "$dist/examples" && cp Examples/Scripts/*.flow "$dist/examples/"     # to try it (README: Try it)
      - name: Check that the package runs on its own
        run: |
          dist="dist/$PACKAGE"
          unset LD_LIBRARY_PATH QT_PLUGIN_PATH QML2_IMPORT_PATH
          # nothing may come from the Qt installation; the X11 libraries the xcb plugin loads are the system's (not on this machine)
          for f in "$dist/bin/flow" "$dist/bin/flowstudio" "$dist"/lib/*.so* "$dist"/plugins/*/*.so; do
            if ldd "$f" | grep -F "$QT_ROOT_DIR"; then echo "::error::$f takes a library from the Qt installation"; exit 1; fi
          done
          for f in "$dist/bin/flow" "$dist/bin/flowstudio" "$dist/plugins/platforms/libqoffscreen.so"; do
            if ldd "$f" | grep "not found"; then echo "::error::$f needs a library the package does not bring"; exit 1; fi
          done
          # what the package needs of the system's C and C++ libraries: not newer than this AlmaLinux 8's (glibc 2.28, libstdc++
          # of GCC 8 = GLIBCXX_3.4.25), or it does not run on the systems the package is for
          needs=$(find "$dist" -type f \( -name '*.so*' -o -perm -u+x \) -exec objdump -T {} + 2>/dev/null | grep -oE 'GLIBC(XX)?_[0-9.]+' | sort -u)
          for lib in GLIBC:2.28 GLIBCXX:3.4.25; do
            name=${lib%%:*}; limit=${lib#*:}
            newest=$(echo "$needs" | grep "^${name}_" | sed "s/^${name}_//" | sort -V | tail -1)
            echo "$name: newest needed $newest (at most $limit)"
            if [ "$(printf '%s\n%s\n' "$newest" "$limit" | sort -V | tail -1)" != "$limit" ]; then
              echo "::error::the package needs ${name}_$newest: it would not run on the systems it is for"; exit 1
            fi
          done
          "$dist/bin/flow" --version
          "$dist/bin/flow" --no-plugins --reference smoke-reference.md
          "$dist/bin/flow" "$dist/examples/fizzbuzz.flow" | grep -qx FizzBuzz
          QT_QPA_PLATFORM=offscreen FG_STUDIO_SCREENSHOT="$PWD/smoke.png" timeout 60 "$dist/bin/flowstudio"
          test -s smoke.png
      - name: Pack
        run: tar -C dist -czf "$PACKAGE.tar.gz" "$PACKAGE"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: ${{ env.PACKAGE }}.tar.gz
          if-no-files-found: error

  # Only for a tag: a draft release with both packages and their checksums.
  release:
    if: github.ref_type == 'tag'
    needs: [version, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat > ../notes.md <<EOF
          ## Downloads

          - **FlowGraph-$VERSION-windows-x64.zip**: \`flow\`, \`flowstudio\` (Qt included) and the SDK: headers, libraries and the CMake
            package (\`find_package(FlowGraph)\`: \`FlowGraph::Core\`, \`FlowGraph::ScriptEditor\`). Windows 10 or later, x64.
          - **FlowGraph-$VERSION-linux-x64.tar.gz**: the same for Linux x64, built on Ubuntu 24.04 (glibc 2.39 or newer). \`flowstudio\`
            brings its Qt; the system needs the usual X11 libraries (for example \`libxcb-cursor0\`, \`libxkbcommon-x11-0\`).
          - **SHA256SUMS.txt**: checksums of both.

          Plugins are binary: build them against this release (the loader refuses a plugin made for another build, with the reason).

          Licenses: the runtime (FlowGraphCore) and \`flow\` are MIT; the editor and \`flowstudio\` are GPL-3.0-only, as they are
          built on KDDockWidgets (GPL). Qt is used under the LGPL-3.0. The texts are in each package (\`LICENSE\`, \`LICENSES/\`).

          EOF
          prerelease=""
          case "$VERSION" in 0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --verify-tag --draft $prerelease \
            --title "FlowGraph $VERSION" --notes-file ../notes.md --generate-notes
