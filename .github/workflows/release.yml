name: Release

# A release is made by pushing a tag:   git tag v0.3.0 && git push origin v0.3.0
# The tag must match project(FlowGraph VERSION ...) in CMakeLists.txt. Windows and Linux are built and tested, packed with what they
# need to run and attached to a DRAFT release: check its notes on GitHub, then press Publish.
# Run it by hand (Actions > Release > Run workflow) to build the packages without making a release: they are kept as artifacts of
# the run, to try before tagging.
#
# The packages hold flow, flowstudio (FlowGraph Studio, on GLWidgets: no Qt) and the SDK of the runtime. The Qt editor library
# (FlowGraph::ScriptEditor) is not in them: who embeds it builds it from the sources, with their own Qt.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The version: from CMakeLists.txt, and it must be the one of the tag.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          version=$(grep -oP 'project\(FlowGraph VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          if [ -z "$version" ]; then echo "::error::no version in CMakeLists.txt"; exit 1; fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::the tag ${GITHUB_REF_NAME} does not match the version $version in CMakeLists.txt (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # flow, flowstudio and the SDK (headers, libraries, CMake package), with the MSVC runtime next to them.
  windows:
    needs: version
    runs-on: windows-2022
    env:
      PACKAGE: FlowGraph-${{ needs.version.outputs.version }}-windows-x64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/msvc-env
      - name: Configure
        run: cmake --preset windows-release -DFG_BUILD_EDITOR=OFF
      - name: Build
        run: cmake --build --preset windows-release
      - name: Test
        run: ctest --preset windows-release
      - name: Install
        shell: bash
        run: |
          # the programs, the SDK, the licenses (GLWidgets' and its libraries' in share/doc/FlowGraph/GLWidgets) and the
          # MSVC runtime in bin (InstallRequiredSystemLibraries)
          cmake --install build/windows-release --prefix "dist/$PACKAGE" --component FlowGraph
          cp -r LICENSE LICENSES README.md "dist/$PACKAGE/"
          mkdir -p "dist/$PACKAGE/examples" && cp Examples/Scripts/*.flow "dist/$PACKAGE/examples/"   # to try it (README: Try it)
      - name: Check that the package runs on its own
        shell: pwsh
        run: |
          $bin = "dist\$env:PACKAGE\bin"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"      # no compiler: only what the package brings
          & "$bin\flow.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "flow does not start" }
          & "$bin\flow.exe" --no-plugins --reference smoke-reference.md
          if ($LASTEXITCODE -ne 0) { throw "flow --reference failed" }
          $out = & "$bin\flow.exe" "dist\$env:PACKAGE\examples\fizzbuzz.flow"
          if ($LASTEXITCODE -ne 0 -or $out -notcontains "FizzBuzz") { throw "the FizzBuzz example does not run: $out" }
          $nodes = & "$bin\flow.exe" --reference | Select-String -SimpleMatch "from FileSystem"
          if ($LASTEXITCODE -ne 0 -or -not $nodes) { throw "flow does not load the FileSystem plugin (bin\plugins)" }
          # flowstudio: its libraries are all there (it prints its version without a window)...
          $p = Start-Process "$bin\flowstudio.exe" -ArgumentList "--version" -PassThru -Wait -NoNewWindow -RedirectStandardOutput version.txt
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path version.txt -Pattern "^flowstudio ")) { throw "flowstudio does not start ($($p.ExitCode))" }
          # ... and its window, with the FizzBuzz example running, as a picture. The runners may have no GPU it can use
          # (Direct3D 12): then only a warning.
          $p = Start-Process "$bin\flowstudio.exe" -PassThru -NoNewWindow -RedirectStandardError smoke-error.txt `
               -ArgumentList "dist\$env:PACKAGE\examples\fizzbuzz.flow", "--run", "--screenshot", "$PWD\smoke.png"
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "flowstudio did not end" }
          $err = Get-Content smoke-error.txt -Raw
          if ($p.ExitCode -eq 0 -and (Test-Path smoke.png)) { "flowstudio drew its window" }
          elseif ($err -match "no GPU device") { "::warning::flowstudio's window was not tried: the runner has no GPU it can use ($err)" }
          else { throw "flowstudio ended with $($p.ExitCode): $err" }
      - name: Pack
        shell: bash
        run: cd dist && 7z a -tzip "../$PACKAGE.zip" "$PACKAGE" > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: ${{ env.PACKAGE }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-windows
          path: smoke.png
          if-no-files-found: ignore

  # The same for Linux: the programs find their libraries next to them (RPATH $ORIGIN/../lib).
  # Built on AlmaLinux 8 (glibc 2.28) with GCC 13 (gcc-toolset: the parts of its C++ library that GCC 8's lacks are linked into
  # the binaries): a program needs the C library of the system it was built on or a newer one, so the package runs on the
  # distributions of 2019 on - RHEL / CentOS / Alma / Rocky 8 and 9, Debian 10, Ubuntu 20.04 and newer. flowstudio's SDL3
  # loads the system's X11 or Wayland libraries and its Vulkan driver when it starts.
  linux:
    needs: version
    runs-on: ubuntu-24.04
    container: almalinux:8
    env:
      PACKAGE: FlowGraph-${{ needs.version.outputs.version }}-linux-x64
      CC: /opt/rh/gcc-toolset-13/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-13/root/usr/bin/g++
    steps:
      - name: Install build tools
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled powertools
          # the compiler, the build tools, git for the checkout
          dnf install -y gcc-toolset-13-gcc-c++ git cmake ninja-build which file findutils tar gzip xz binutils pkgconf-pkg-config
          # SDL3 for flowstudio: X11, Wayland, the input methods; fontconfig for the system's fonts (strict=0: what this
          # system does not have is left out, as SDL3 leaves out what it does not find)
          dnf install -y --setopt=strict=0 libX11-devel libXext-devel libXrandr-devel libXcursor-devel libXfixes-devel libXi-devel \
            libXScrnSaver-devel libXtst-devel libxkbcommon-devel wayland-devel wayland-protocols-devel mesa-libEGL-devel \
            mesa-libGL-devel mesa-libgbm-devel libdrm-devel dbus-devel ibus-devel systemd-devel fontconfig-devel
          # to try flowstudio's window: a display without a screen, Vulkan on the CPU (when the system has it), a font
          dnf install -y --setopt=strict=0 xorg-x11-server-Xvfb mesa-vulkan-drivers vulkan-loader dejavu-sans-fonts
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure
        # lib, not lib64 (the default of RHEL-like systems): the layout of the package, and where its RPATH looks
        run: cmake --preset linux-release -DFG_BUILD_EDITOR=OFF -DCMAKE_INSTALL_LIBDIR=lib '-DCMAKE_INSTALL_RPATH=$ORIGIN/../lib'
      - name: Build
        run: cmake --build --preset linux-release
      - name: Test
        run: ctest --preset linux-release
      - name: Install
        run: |
          dist="dist/$PACKAGE"
          cmake --install build/linux-release --prefix "$dist" --component FlowGraph
          cp -r LICENSE LICENSES README.md "$dist/"
          mkdir -p "$dist/examples" && cp Examples/Scripts/*.flow "$dist/examples/"     # to try it (README: Try it)
      - name: Check that the package runs on its own
        run: |
          dist="dist/$PACKAGE"
          unset LD_LIBRARY_PATH
          for f in "$dist/bin/flow" "$dist/bin/flowstudio" "$dist"/lib/*.so* "$dist"/bin/plugins/*.so; do
            if ldd "$f" | grep "not found"; then echo "::error::$f needs a library the package does not bring"; exit 1; fi
          done
          echo "flowstudio needs:"; ldd "$dist/bin/flowstudio"
          # what the package needs of the system's C and C++ libraries: not newer than this AlmaLinux 8's (glibc 2.28, libstdc++
          # of GCC 8 = GLIBCXX_3.4.25), or it does not run on the systems the package is for
          needs=$(find "$dist" -type f \( -name '*.so*' -o -perm -u+x \) -exec objdump -T {} + 2>/dev/null | grep -oE 'GLIBC(XX)?_[0-9.]+' | sort -u)
          for lib in GLIBC:2.28 GLIBCXX:3.4.25; do
            name=${lib%%:*}; limit=${lib#*:}
            newest=$(echo "$needs" | grep "^${name}_" | sed "s/^${name}_//" | sort -V | tail -1)
            echo "$name: newest needed $newest (at most $limit)"
            if [ "$(printf '%s\n%s\n' "$newest" "$limit" | sort -V | tail -1)" != "$limit" ]; then
              echo "::error::the package needs ${name}_$newest: it would not run on the systems it is for"; exit 1
            fi
          done
          "$dist/bin/flow" --version
          "$dist/bin/flow" --no-plugins --reference smoke-reference.md
          "$dist/bin/flow" "$dist/examples/fizzbuzz.flow" | grep -qx FizzBuzz
          "$dist/bin/flow" --reference | grep -q "from FileSystem" || { echo "::error::flow does not load the FileSystem plugin (bin/plugins)"; exit 1; }
          "$dist/bin/flowstudio" --version | grep -q "^flowstudio " || { echo "::error::flowstudio does not start"; exit 1; }
          # its window, with the FizzBuzz example running, as a picture: on a virtual display, with Vulkan on the CPU when
          # this system has it - otherwise only a warning
          if command -v xvfb-run > /dev/null; then
            status=0
            xvfb-run -a timeout 60 "$dist/bin/flowstudio" "$dist/examples/fizzbuzz.flow" --run --screenshot "$PWD/smoke.png" 2> smoke-error.txt || status=$?
            if [ "$status" -eq 0 ] && [ -s smoke.png ]; then
              echo "flowstudio drew its window"
            elif grep -q "no GPU device" smoke-error.txt; then
              echo "::warning::flowstudio's window was not tried: no Vulkan driver here ($(cat smoke-error.txt))"
            else
              echo "::error::flowstudio ended with $status: $(cat smoke-error.txt)"; exit 1
            fi
          else
            echo "::warning::flowstudio's window was not tried: no Xvfb here"
          fi
      - name: Pack
        run: tar -C dist -czf "$PACKAGE.tar.gz" "$PACKAGE"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: ${{ env.PACKAGE }}.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-linux
          path: smoke.png
          if-no-files-found: ignore

  # Only for a tag: a draft release with both packages and their checksums.
  release:
    if: github.ref_type == 'tag'
    needs: [version, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat > ../notes.md <<EOF
          ## Downloads

          - **FlowGraph-$VERSION-windows-x64.zip**: \`flow\`, \`flowstudio\` (FlowGraph Studio) and the SDK of the runtime: headers,
            libraries and the CMake package (\`find_package(FlowGraph)\`: \`FlowGraph::Core\`). Windows 10 or later, x64; \`flowstudio\`
            draws with Direct3D 12.
          - **FlowGraph-$VERSION-linux-x64.tar.gz**: the same for Linux x64. It runs on distributions with glibc 2.28 or newer:
            RHEL / CentOS / Alma / Rocky 8 and 9, Debian 10, Ubuntu 20.04 and newer. \`flowstudio\` uses the system's X11 or Wayland
            and draws with Vulkan (the graphics driver's, or Mesa's).
          - **SHA256SUMS.txt**: checksums of both.

          Plugins are binary: build them against this release (the loader refuses a plugin made for another build, with the reason).
          The Qt editor library (\`FlowGraph::ScriptEditor\`) is not in the packages: build it from the sources (Docs/Embedding.md).

          Licenses: the runtime (FlowGraphCore) and \`flow\` are MIT; \`flowstudio\` is GPL-3.0-only. It is built on GLWidgets (MIT)
          and the libraries it links in (SDL3, FreeType, HarfBuzz, SheenBidi, libunibreak, ThorVG, the Vazirmatn font), whose
          licenses are in \`share/doc/FlowGraph/GLWidgets\`. The texts are in each package (\`LICENSE\`, \`LICENSES/\`).

          EOF
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac           # 1.0.0-beta: a pre-release
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --verify-tag --draft $prerelease \
            --title "FlowGraph $VERSION" --notes-file ../notes.md --generate-notes
