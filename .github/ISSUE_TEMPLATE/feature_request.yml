name: Idea or request
description: Something FlowGraph should do, or do better
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you would like
      description: What it should do, and what you would use it for.
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How you do it now
      description: A workaround you use today, if there is one.
